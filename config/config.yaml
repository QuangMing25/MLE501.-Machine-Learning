# Credit Scoring - Configuration File

# Paths
paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_submission: "data/submission"
  models: "models"
  reports: "reports"
  figures: "reports/figures"

# Data files
data_files:
  train: "cs-training.csv"
  test: "cs-test.csv"
  sample_submission: "sampleEntry.csv"
  data_dictionary: "Data Dictionary.xls"

# Features
features:
  numerical:
    - RevolvingUtilizationOfUnsecuredLines
    - age
    - NumberOfTime30-59DaysPastDueNotWorse
    - DebtRatio
    - MonthlyIncome
    - NumberOfOpenCreditLinesAndLoans
    - NumberOfTimes90DaysLate
    - NumberRealEstateLoansOrLines
    - NumberOfTime60-89DaysPastDueNotWorse
    - NumberOfDependents

  target: "SeriousDlqin2yrs"

# Preprocessing
preprocessing:
  missing_value_strategy:
    MonthlyIncome: "median"  # or "mean", "knn"
    NumberOfDependents: "median"  # or "mode", "knn"

  outlier_handling:
    method: "capping"  # or "removal", "None"
    age_min: 18
    age_max: 100
    debt_ratio_max_percentile: 99
    revolving_util_max: 2.0

  scaling:
    method: "standard"  # or "minmax", "robust"

  imbalanced_handling:
    method: "smote"  # or "class_weight", "undersampling", "None"
    sampling_strategy: 0.5  # ratio of minority to majority class

# Train-test split
train_test_split:
  test_size: 0.2
  random_state: 42
  stratify: true

# Cross-validation
cross_validation:
  method: "stratified_kfold"
  n_splits: 5
  shuffle: true
  random_state: 42

# Models
models:
  logistic_regression:
    enabled: true
    params:
      C: [0.001, 0.01, 0.1, 1, 10, 100]
      penalty: ["l1", "l2"]
      solver: ["liblinear"]
      class_weight: ["balanced", null]
      max_iter: 1000
      random_state: 42

  random_forest:
    enabled: true
    params:
      n_estimators: [100, 200, 300]
      max_depth: [10, 20, 30, null]
      min_samples_split: [2, 5, 10]
      min_samples_leaf: [1, 2, 4]
      max_features: ["sqrt", "log2"]
      class_weight: ["balanced", null]
      random_state: 42
      n_jobs: -1

  xgboost:
    enabled: true
    params:
      n_estimators: [100, 200, 300]
      learning_rate: [0.01, 0.05, 0.1]
      max_depth: [3, 5, 7]
      min_child_weight: [1, 3, 5]
      subsample: [0.8, 0.9, 1.0]
      colsample_bytree: [0.8, 0.9, 1.0]
      gamma: [0, 0.1, 0.2]
      random_state: 42
      n_jobs: -1
      eval_metric: "auc"

  lightgbm:
    enabled: true
    params:
      n_estimators: [100, 200, 300]
      learning_rate: [0.01, 0.05, 0.1]
      num_leaves: [31, 50, 70]
      max_depth: [-1, 10, 20]
      min_child_samples: [20, 30, 50]
      subsample: [0.8, 0.9, 1.0]
      colsample_bytree: [0.8, 0.9, 1.0]
      reg_alpha: [0, 0.1, 0.5]
      reg_lambda: [0, 0.1, 0.5]
      random_state: 42
      n_jobs: -1
      metric: "auc"

  svm:
    enabled: true
    params:
      C: [0.1, 1, 10, 100]
      kernel: ["linear", "rbf"]
      gamma: ["scale", "auto", 0.001, 0.01]
      class_weight: ["balanced", null]
      probability: true
      random_state: 42
    # Note: SVM can be slow with large datasets
    # Consider using subset for tuning or LinearSVC for speed

# Hyperparameter tuning
hyperparameter_tuning:
  method: "random_search"  # or "grid_search", "bayesian"
  n_iter: 50  # for random_search
  scoring: "roc_auc"
  cv: 5
  n_jobs: -1
  verbose: 2

# Evaluation metrics
evaluation:
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "roc_auc"
    - "pr_auc"
  threshold: 0.5  # default threshold for classification

# Random seed
random_state: 42

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
